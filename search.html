<html>
  <head>
    <title>Web Master</title>
    <style>
      body {
        background-color: #FF6B6B;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
      }
      h1 {
        text-align: center;
        color: #065f46;
        margin-bottom: 30px;
      }
      input#search-bar {
        border: 2px solid #a7f3d0;
        border-radius: 20px;
        padding: 10px 15px;
        width: 300px;
        font-size: 1.1em;
        transition: border-color 0.3s;
      }
      input#search-bar:focus {
        border-color: red;
        outline: none;
      }
      button#submit {
        background-color: #34d399;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 15px;
        font-size: 1.1em;
        margin-left: 10px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button#submit:hover {
        background-color: #10b981;
      }
      
      #loading {
        margin-top: 20px;
        padding: 15px;
        border: 1px dashed #d1d5db;
        border-radius: 8px;
        background-color: #fff;
        text-align: center;
      }
      #search-label {
        color: #4b5563;
        font-weight: bold;
      }
      progress#file {
        appearance: none;
        width: 80%;
        height: 8px;
        border: none;
        border-radius: 4px;
      }
      
      #results-container {
        max-width: 800px;
        margin: 20px auto;
        padding: 25px;
        background-color: #ffffff; 
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05); 
        border: 1px solid #e0e7ff; 
      }

      #results-header {
        margin-bottom: 20px;
      }

      #query-display {
        color: #4f46e5; 
        font-size: 1.6em;
        margin-bottom: 5px;
        font-weight: 700;
        display: flex;
        align-items: center;
      }
      #query-display::before {
        margin-right: 10px;
        font-size: 1.2em;
      }

      #count-display {
        color: #6b7280;
        font-size: 0.9em;
      }

      #results-header hr {
        border: 0;
        height: 1px;
        background-color: #e5e7eb; 
        margin-top: 10px;
      }

      #search-results {
        list-style-type: none;
        padding: 0;
      }

      .result-card{
        background-color: #f7f9fc; 
        border: 1px solid #d1d5db;
        border-left: 6px solid #f97316; 
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 15px;
        transition: all 0.3s ease;
        font-size: 1.1em;
        color: #1f2937; 
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .result-card:hover {
        box-shadow: 0 6px 15px rgba(249, 115, 22, 0.15); 
        transform: translateY(-2px);
        border-color: #f97316;
      }
      
      .relevance-badge {
          background-color: #ef4444; 
          color: white;
          padding: 4px 10px;
          border-radius: 50px;
          font-size: 0.8em;
          font-weight: bold;
          min-width: 60px;
          text-align: center;
      }
      .relevance-badge.high { background-color: #10b981; } 
      .relevance-badge.medium { background-color: #f59e0b; } 
      .relevance-badge.low { background-color: #ef4444; } 

      #pagination-controls {
        text-align: center;
        margin-top: 25px;
        gap: 15px;
        justify-content: center;
        display: flex;
        align-items: center;
      }

      .page-btn {
        background-color: #4f46e5; 
        color: white;
        border: none;
        border-radius: 8px; 
        padding: 10px 18px;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        font-weight: 600;
      }

      .page-btn:hover:not(:disabled) {
        background-color: #4338ca;
        transform: translateY(-1px);
      }

      #page-info{
        font-weight: 600;
        color: #4b5563;
        font-size: 1.1em;
      }

      .page-btn:disabled {
        background-color: #d1d5db;
        cursor: not-allowed;
        color: #9ca3af;
      }

    </style>
  </head>
  <body>
    <h1>Search Bar</h1>
    <input id="search-bar" placeholder="Search">
    <button id="submit" style="visibility:visible" onclick="slowAIsearch()">⌕</button><br><br>

    <div id="loading" style="visibility:hidden">
      <label for="file" id="search-label">Searching Database...</label><br>
      <progress id="file" value="0" max="100"></progress><br>
    </div>

    <div id="results" style="visibility:hidden">
  <div id="results-container">
    
    <div id="results-header">
      <h3 id="query-display">Search Results</h3> <p id="count-display">Showing <span id="current-count">1-10</span> of <span id="total-results">1</span> items</p>
      <hr>
    </div>
    
    <ul id="search-results"></ul>

    <div id="pagination-controls">
      <button onclick="back()" id="back-btn" class="page-btn" disabled>&lt; Previous</button>
      <span id="page-info">
        Page <c id="current-page">1</c> of <c id="total-pages">1</c>
      </span>
      <button onclick="forward()" id="forward-btn" class="page-btn" disabled>Next &gt;</button>
    </div>
    
  </div>
</div>

    <!--Scripts below-->
    <script type="module">
      //AIzaSyAPmxTfZDIekGCyubKBwXHYCAdcMuLLMnQ
      import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

      // Replace this with your API key from Google AI Studio
      const genAI = new GoogleGenerativeAI("AIzaSyAPmxTfZDIekGCyubKBwXHYCAdcMuLLMnQ");

      window.slowAIsearch = async function() {
        startLoadAnimation();

        const prompt = "Take the following Javascript list and return a string of integers ordered from greatest to least relevancy to the search query. The search query is '" + document.getElementById("search-bar").value + "The database is " + database.toString() + ". Only return the string of integers with no other text. It should just be a line of "+database.length+" numbers without any line breaks, spaces, or characters. The integers should be between 0 and 9, where 0 is the most relevant and 9 is the least relevant.";
        const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

        const result = await model.generateContent(prompt);
        const response = await result.response.text();

        fullLoadAnimation(response);
      }

      let nuDatabase = [
        
      ]

      let database = [
        // Vegetables (Low-calorie, low-processed)
        "spinach",
        "kale",
        "lettuce",
        "broccoli",
        "carrot",
        "cucumber",
        "tomato",
        "zucchini",
        "bell pepper",
        "cauliflower",
        "celery",
        "onion",
        "garlic",
        "green beans",
        "eggplant",

        // Fruits (Low-processed, moderate calories)
        "apple",
        "banana",
        "orange",
        "grapes",
        "blueberries",
        "strawberries",
        "pineapple",
        "watermelon",
        "peach",
        "pear",
        "mango",
        "avocado",

        // Whole grains (moderate processing, complex carbs)
        "brown rice",
        "quinoa",
        "whole wheat bread",
        "oatmeal",
        "barley",
        "bulgur",
        "millet",

        // Meat & protein (varying processing levels)
        "chicken breast",
        "ground beef",
        "salmon",
        "tuna",
        "turkey",
        "pork chop",
        "bacon",
        "hot dog",
        "pepperoni",
        "beef jerky",
        "sausages",
        "spam",
        "ham",
        "rotisserie chicken",

        // Dairy & Eggs
        "milk",
        "yogurt",
        "Greek yogurt",
        "cheddar cheese",
        "cottage cheese",
        "cream cheese",
        "butter",
        "ice cream",
        "eggs",
        "whipped cream",

        // Legumes & Nuts
        "black beans",
        "chickpeas",
        "lentils",
        "edamame",
        "tofu",
        "peanut butter",
        "almonds",
        "cashews",
        "walnuts",

        // Baked goods & snacks (moderate to high processing)
        "white bread",
        "croissant",
        "bagel",
        "donut",
        "muffin",
        "granola bar",
        "potato chips",
        "popcorn",
        "pretzels",
        "crackers",

        // Sweets & Desserts (highly processed, high-calorie)
        "chocolate bar",
        "gummy bears",
        "cheesecake",
        "cupcake",
        "cookies",
        "brownies",
        "ice cream sandwich",
        "pudding cup",
        "fruit snacks",

        // Fast food & Frozen (ultra-processed)
        "pizza",
        "chicken nuggets",
        "frozen lasagna",
        "instant ramen",
        "TV dinner",
        "microwave popcorn",
        "mac and cheese box",
        "fish sticks",
        "corn dog",

        // Condiments & Sauces
        "ketchup",
        "mayonnaise",
        "ranch dressing",
        "soy sauce",
        "barbecue sauce",
        "sriracha"
      ];

      let optimizedSearch = false;
      let searchRes = [];
      const mostResults = 30;
      const mostRelevance = 5;
      const resultsPerPage = 10;
      let currentPage = 1;
      let totalPages = 1;

      onloadScript();
      function onloadScript(){
        let hash = window.location.hash;
        if(hash.length > 1){
          document.getElementById("search-bar").value = hash.substring(1);
          slowAIsearch();
        }
      }
      function startLoadAnimation(){
        document.getElementById("loading").style.visibility = "visible";
        document.getElementById("submit").style.visibility = "hidden";

        let progressBar = document.getElementById("file");
        let width = 0;
        let id = setInterval(frame, database.length*8+250);
        function frame() {
          if(!optimizedSearch){
            if (width >= 100) {
              clearInterval(id);
            } else {
              if(width > 75){
                document.getElementById("search-label").innerText = "Deep Analysis (this may take a while) ...";
                width += 0.2;
              }
              else if(width > 50){
                document.getElementById("search-label").innerText = "Analyzing database ...";
                width += 0.5;
              }
              else if(width > 25){
                document.getElementById("search-label").innerText = "Comparing results ...";
                width += 1;
              }
              else {
                width += 3;
              }
              progressBar.value = width;
            }
          }
          else {
            clearInterval(id);
          }
        }
      }

      function fullLoadAnimation(response){
        optimizedSearch = true;                            //Searching database...
        document.getElementById("search-label").innerText = "Optimizing Algorithm ...";
        
        let progressBar = document.getElementById("file");
        let width = parseInt(progressBar.value);
        let ogChange = 0.2;
        let id = setInterval(frame, 250);
        function frame() {
          if (width >= 100) {
            clearInterval(id);
            document.getElementById("loading").style.visibility = "hidden";
            document.getElementById("results").style.visibility = "visible";
            alert(response);
            processSearchResults(response);
          } else {
            width += ogChange;
            ogChange += 0.3;
            progressBar.value = width;
          }
        }
      }

      function fastNonAISearch(){
        let searchQuery = document.getElementById("search-bar").value;
        let searchResults = document.getElementById("search-results");

        //Look though all of the database to see what search results match
        for(let i=0; i<database.length; i++){
          if(database[i].split(searchQuery)[0] != database[i]){
            searchResults.innerHTML += "<li>"+database[i]+"</li>"
          }
        }
      }

      function processSearchResults(response){
        document.getElementById("loading").style.visibility = "hidden";
        document.getElementById("results").style.visibility = "visible";

        let searchResults = document.getElementById("search-results");
        searchResults.innerHTML = "";

        let indices = response.split("");
        for(let j=0; j<mostRelevance; j++){
          for(let i=0; i<indices.length; i++){
            let index = parseInt(indices[i]);
            if(index == j){
              searchRes.push(database[i]);
            }
          }
          if(searchRes.length >= mostResults){
            break;
          }
        }

        updateResults();
      }

      window.back = function() {
        if(currentPage > 1){
          currentPage--;
          updateResults();
        }
      }
      
      window.forward = function() {
        if(currentPage < totalPages){
          currentPage++;
          updateResults();
        }
      }

      function updateResults(){
        let searchResults = document.getElementById("search-results");
        searchResults.innerHTML = "";

        totalPages = Math.ceil(searchRes.length / resultsPerPage);
        document.getElementById("current-page").innerText = currentPage;
        document.getElementById("total-pages").innerText = totalPages;

        let startIndex = (currentPage-1) * resultsPerPage;
        let endIndex = Math.min(startIndex + resultsPerPage, searchRes.length);

        for(let i=startIndex; i<endIndex; i++){
          searchResults.innerHTML += "<li>"+searchRes[i]+"</li>"
        }
      }

    </script>
  </body>
</html>
