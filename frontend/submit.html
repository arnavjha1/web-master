<div class="margin-container">
  <div class="two-fold">
    <form id="resourceForm">
      <h2>Submit a New Resource</h2>
      <input class="styled-input" name="name" id="name" placeholder="Resource Name" required><br><br>
      <input class="styled-input" name="category" id="category" placeholder="Category" required><br><br>
      <input class="styled-input" name="website" id="website" placeholder="Website URL" required><br><br>
      <input class="styled-input" name="location" id="location" placeholder="Location" required><br><br>
      <input class="styled-input" name="phone" id="phone" placeholder="Phone Number" required><br><br>
      <input class="styled-input" name="image" id="image" placeholder="Image URL" required><br><br>
      <textarea class="styled-input" name="description" id="description" placeholder="Description" required></textarea>
      <br><br><button type="submit">Submit</button>
    </form>
  </div>
  <div class="two-fold" id="right">
    <section id="highlights">
      <div class="spotlight-grid" id="submit-container"></div>
    </section>
  </div>
</div>
